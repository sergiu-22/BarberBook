name: Publish and verify BarberBook laboratory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/laboratory.yml']
permissions:
  contents: write
jobs:
  laboratory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Publish original history and verify synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYLAB'
          import base64, json, os, pathlib, subprocess, urllib.request
          def run(*args):
              print('$ '+ ' '.join(args), flush=True)
              subprocess.run(args,check=True)
          run('git','config','user.name','Roșca Sergiu')
          run('git','config','user.email','sergiu-22@users.noreply.github.com')
          pathlib.Path('/tmp/laboratory.bundle').write_bytes(base64.b64decode(''))
          run('git','fetch','/tmp/laboratory.bundle','+refs/heads/*:refs/remotes/laboratory/*','+refs/tags/*:refs/tags/*')
          run('git','merge','--no-ff','--allow-unrelated-histories','-Xtheirs','laboratory/main','-m','merge: publish original BarberBook laboratory history')
          branches=['feature/services','feature/availability','feature/bookings','feature/staff','feature/reports','config/slots-short','config/slots-long']
          for branch in branches:
              run('git','branch',branch,'laboratory/'+branch)
          run('python3','-m','unittest','discover','-s','tests','-v')
          run('git','push','origin','--all')
          run('git','push','origin','--tags')
          body={'message':'docs: record change made directly through GitHub API','branch':'main',
                'content':base64.b64encode(b'# Remote update\n\nThis file was created directly through the GitHub contents API for laboratory task 16.\n').decode()}
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/docs/remote-update.md',
                data=json.dumps(body).encode(),method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(request) as response:
              payload=json.load(response)
          print('REMOTE_API_COMMIT='+payload['commit']['sha'],flush=True)
          run('git','pull','--ff-only','origin','main')
          pathlib.Path('docs/local-update.md').write_text('# Local update\n\nThe remote update was pulled into the local runner checkout. This local file was committed and pushed to origin/main for laboratory task 17.\n')
          run('git','add','docs/local-update.md')
          run('git','commit','-m','docs: synchronize local update after remote pull')
          print('LOCAL_UPDATE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          run('git','push','origin','main')
          url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'.git'
          run('git','clone',url,'/tmp/BarberBook-verification-clone')
          subprocess.run(['python3','-m','unittest','discover','-s','tests','-v'],cwd='/tmp/BarberBook-verification-clone',check=True)
          run('git','branch','-a')
          run('git','tag','--list')
          run('git','log','--oneline','--graph','--decorate','--all')
          pathlib.Path('.env').write_text('LOCAL_EXAMPLE=true\n');pathlib.Path('debug.log').write_text('local diagnostics\n')
          pathlib.Path('exports').mkdir(exist_ok=True);pathlib.Path('exports/report.csv').write_text('state,count\nconfirmed,1\n')
          run('git','check-ignore','-v','.env','debug.log','exports/report.csv')
          run('git','ls-files','.env','debug.log','exports/report.csv')
          run('git','status','--short')
          print('FINAL_HEAD='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          print('COMMIT_COUNT='+subprocess.check_output(['git','rev-list','--count','--all'],text=True).strip(),flush=True)
          PYLAB
