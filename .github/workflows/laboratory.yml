name: Verify BarberBook laboratory synchronization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/laboratory.yml']
permissions:
  contents: write
jobs:
  laboratory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Stable tag remote edit pull local push and clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYLAB'
          import base64, json, os, pathlib, subprocess, urllib.request
          def run(*args):
              print('$ '+ ' '.join(args), flush=True)
              subprocess.run(args,check=True)
          def api(path, data, method='POST'):
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+path,data=json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          run('git','config','user.name','Roșca Sergiu')
          run('git','config','user.email','sergiu-22@users.noreply.github.com')
          stable='52dd2cd968c4e3e7f6ce0698466d3d95865dcf83'
          run('git','tag','-a','v1.0.0',stable,'-m','Stable BarberBook prototype with ten passing tests')
          if subprocess.run(['git','push','origin','--tags']).returncode != 0:
              tagged=api('/git/tags',{'tag':'v1.0.0','message':'Stable BarberBook prototype with ten passing tests','object':stable,'type':'commit'})
              api('/git/refs',{'ref':'refs/tags/v1.0.0','sha':tagged['sha']})
              print('STABLE_TAG_PUBLISHED_THROUGH_GITHUB_API='+tagged['sha'],flush=True)
          run('git','push','origin','--all')
          run('python3','-m','unittest','discover','-s','tests','-v')
          body={'message':'docs: record change made directly through GitHub API','branch':'main','content':base64.b64encode(b'# Remote update\n\nCreated directly through GitHub API for laboratory task 16.\n').decode()}
          payload=api('/contents/docs/remote-update.md',body,'PUT')
          print('REMOTE_API_COMMIT='+payload['commit']['sha'],flush=True)
          run('git','pull','--ff-only','origin','main')
          pathlib.Path('docs/local-update.md').write_text('# Local update\n\nThe remote update was pulled, then this local file was committed and pushed for laboratory task 17.\n')
          run('git','add','docs/local-update.md')
          run('git','commit','-m','docs: synchronize local update after remote pull')
          print('LOCAL_UPDATE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          run('git','push','origin','main')
          run('git','clone','https://github.com/'+os.environ['GITHUB_REPOSITORY']+'.git','/tmp/BarberBook-verification-clone')
          subprocess.run(['python3','-m','unittest','discover','-s','tests','-v'],cwd='/tmp/BarberBook-verification-clone',check=True)
          run('git','branch','-a')
          run('git','tag','--list')
          run('git','log','--oneline','--graph','--decorate','--all')
          pathlib.Path('.env').write_text('LOCAL_EXAMPLE=true\n');pathlib.Path('debug.log').write_text('local diagnostics\n')
          pathlib.Path('exports').mkdir(exist_ok=True);pathlib.Path('exports/report.csv').write_text('state,count\nconfirmed,1\n')
          run('git','check-ignore','-v','.env','debug.log','exports/report.csv')
          run('git','ls-files','.env','debug.log','exports/report.csv')
          run('git','status','--short')
          print('FINAL_HEAD='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          print('COMMIT_COUNT='+subprocess.check_output(['git','rev-list','--count','--all'],text=True).strip(),flush=True)
          PYLAB
